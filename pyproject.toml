[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvm"
version = "0.0.0"
description = "Prompt version management library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.94.0",
  "fastmcp>=3.2.0",
  "openai>=2.31.0",
  "openpyxl>=3.1.5",
  "pandas>=3.0.2",
  "pytest>=9.0.2",
  "PyYAML>=6.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
server = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
pvm = "pvm.cli:main"
pvm-server = "server.main:main"
pvm-mcp = "pvm.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pvm*", "server*"]

[tool.setuptools.package-data]
server = [
  "ui/static/**/*",
  "ui/templates/**/*",
]
